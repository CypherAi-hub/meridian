name: PHANTOM research checks
on:
  pull_request:
    paths: ['packages/phantom/**', '.github/workflows/phantom-checks.yml']
  push:
    paths: ['packages/phantom/**', '.github/workflows/phantom-checks.yml']
permissions:
  contents: read
jobs:
  paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/phantom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/phantom/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: python3 -m unittest discover -s research -p 'test_*.py'
