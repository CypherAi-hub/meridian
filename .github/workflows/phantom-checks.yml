name: PHANTOM research checks
on:
  pull_request:
    paths: ['packages/phantom/**', '.github/workflows/phantom-checks.yml']
  push:
    paths: ['packages/phantom/**', '.github/workflows/phantom-checks.yml']
permissions:
  contents: read
jobs:
  paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: phantom_test
          POSTGRES_PASSWORD: phantom_ci_test_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phantom_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PHANTOM_TEST_DATABASE_URL: postgresql://phantom_test:phantom_ci_test_only@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: packages/phantom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/phantom/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run research:forward:test
      - run: npm run typecheck
      - run: npm run build
      - run: python3 -m unittest discover -s research -p 'test_*.py'
